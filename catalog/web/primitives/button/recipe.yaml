id: web/primitives/button
name: Button
kind: primitive
platform: web
description: ボタン。variant 6 種 (default / destructive / outline / secondary / ghost / link) と size 8 種を持つ。shadcn/ui の button と同じ API。
tags: [form, interactive, cva]
stack:
  framework: react
  language: typescript
  styling: tailwind
  ui: shadcn
files:
  - from: files/button.tsx
    to: "{{@componentsDir}}/button.tsx"
requires: [web/lib/cn]
dependencies:
  class-variance-authority: "^0.7.0"
  radix-ui: "^1.6.0"
ai:
  use_when: |
    クリックで動作を起こす要素が必要なとき。見た目だけボタンにしたリンクも
    asChild で作れるので、<a> や <Link> を直接スタイルしない。
  do_not:
    - 色やサイズをクラスで上書きしない。variant / size を使う (variant="destructive"、size="sm" 等)
    - リンクにするとき <a> を自分でスタイルしない。asChild を使って <Button asChild><Link …/></Button> と書く
    - buttonVariants を呼んで別の要素に className として貼らない。data-slot / data-variant が付かず、スタイルの上書き対象を選べなくなる
    - アイコンだけのボタンに size="icon" を使うときは aria-label を必ず付ける (文字が無いので読み上げ内容が無くなる)
    - loading 状態は持たない。無効化するだけなら disabled、スピナーを出すなら children 側で描画する
  integration: |
    variant と size は cva で解決するので、className で渡した指定は
    tailwind-merge が後勝ちで畳む。恒久的な見た目の変更は buttonVariants の
    定義を直し、その場限りの調整だけ className で渡す。

    asChild は radix-ui の Slot を使う。子要素は 1 つだけで、props を受け取れる
    要素であること (<Link>、<a> など)。複数の子を渡すと実行時に落ちる。

    data-slot="button" / data-variant / data-size が付くので、外側から
    [&_[data-slot=button]]:… のような形で束ねて調整できる。
